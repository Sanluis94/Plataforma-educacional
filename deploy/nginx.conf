worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  include /tmp/kortex-host.conf;
  map "$kortex_allowed_host:$uri" $kortex_host_rejected {
    default 1;
    ~^1: 0;
    "0:/healthz" 0;
  }
  map $uri $cache_control {
    default "no-cache";
    ~^/assets/ "public, max-age=31536000, immutable";
    /installation.json "no-store";
    /healthz "no-store";
    /sw.js "no-store";
  }
  server {
    listen 8080;
    if ($kortex_host_rejected) { return 421; }
    root /usr/share/nginx/html;
    index index.html;
    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    # TLS terminates at the managed ingress/load balancer. Its HTTPS endpoint
    # must set HSTS; this local HTTP server never asserts TLS for /healthz.
    location = /healthz { default_type text/plain; return 200 "ok\n"; }
    location ^~ /assets/ { try_files $uri =404; }
    location ^~ /local-data/ { return 404; }
    location ~ /\. { return 404; }
    location ~* \.(?:json|webmanifest|js|css|wasm|svg|png|jpg|jpeg|webp|gif|ico|woff2?|ttf|mp3|mp4|pdf|txt)$ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
  }
}

name: Desenvolvimento

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# No credentials are required for tests or compilation. Explicit empty values
# also override any accidental local .env files included in the checkout.
env:
  VITE_FIREBASE_API_KEY: ''
  VITE_FIREBASE_AUTH_DOMAIN: ''
  VITE_FIREBASE_PROJECT_ID: ''
  VITE_FIREBASE_STORAGE_BUCKET: ''
  VITE_FIREBASE_MESSAGING_SENDER_ID: ''
  VITE_FIREBASE_APP_ID: ''
  VITE_FIREBASE_MEASUREMENT_ID: ''
  VITE_GEMINI_API_KEY: ''
  VITE_USE_FIREBASE_EMULATORS: 'false'
  VITE_DISABLE_AI: 'true'

jobs:
  secrets:
    name: Verificar segredos introduzidos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Instalar verificador com versão e checksum fixados
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks"
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Conferir arquivos privados e proteções do Git
        run: node scripts/security/check-private-files.mjs
      - name: Impedir novos segredos em commits com saída mascarada
        env:
          SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SCAN_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if ! [[ "$SCAN_HEAD" =~ ^[0-9a-f]{40}$ ]]; then exit 1; fi
          if ! [[ "$SCAN_BASE" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "$SCAN_BASE^{commit}" 2>/dev/null; then
            SCAN_BASE=$(git rev-parse "$SCAN_HEAD^")
          fi
          "$RUNNER_TEMP/gitleaks/gitleaks" git . --log-opts="$SCAN_BASE..$SCAN_HEAD" --redact=100 --ignore-gitleaks-allow --report-format=json --report-path="$RUNNER_TEMP/gitleaks-report.json"

  validate:
    name: Testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências do lockfile
        run: npm ci
      - name: Exigir conteúdo individual nos 582 laboratórios
        run: npm run labs:audit
      - name: Conferir os índices leves do catálogo
        run: node scripts/labs/generate-learning-index.mjs --check
      - name: Testar sem serviços reais
        run: npm run test:local
      - name: Compilar TypeScript e aplicação
        run: npm run build

  permissions:
    name: Permissões e fluxos no Firebase local
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar dependências do lockfile
        run: npm ci
      - name: Verificar Auth e Firestore locais
        run: npm run emulators:check
      - name: Verificar captura e relatórios de aprendizagem
        run: npm run etl:emulator-check
      - name: Verificar publicação, privacidade e acompanhamento
        run: npm run evolution:emulator-check
      - name: Verificar projetos escolares e domésticos com dados fictícios
        run: npm run cloud:isolation-check

  cloud:
    name: Contêineres e vínculo por instalação
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validar isolamento e configuração pública
        run: npm run cloud:test
      - name: Gerar configurações fictícias fora do Git
        run: node scripts/cloud/fixtures.mjs
      - name: Compilar imagem da escola com configuração fictícia
        run: >-
          docker build --secret id=installation,src=.local/cloud-fixtures/school.json
          --build-arg KORTEX_INSTALLATION_SHA256=$(node scripts/cloud/manifest-fingerprint.mjs .local/cloud-fixtures/school.json)
          --build-arg KORTEX_SOURCE_REVISION=${{ github.sha }} -t kortex-school:ci .
      - name: Verificar contêiner da escola e recusa de instalação incorreta
        run: node scripts/cloud/check-container.mjs .local/cloud-fixtures/school.json --image kortex-school:ci
      - name: Compilar imagem doméstica com configuração fictícia
        run: >-
          docker build --secret id=installation,src=.local/cloud-fixtures/home.json
          --build-arg KORTEX_INSTALLATION_SHA256=$(node scripts/cloud/manifest-fingerprint.mjs .local/cloud-fixtures/home.json)
          --build-arg KORTEX_SOURCE_REVISION=${{ github.sha }} -t kortex-home:ci .
      - name: Verificar contêiner doméstico e recusa de instalação incorreta
        run: node scripts/cloud/check-container.mjs .local/cloud-fixtures/home.json --image kortex-home:ci

  lint:
    name: Lint informativo — dívida existente
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências do lockfile
        run: npm ci
      - name: Executar lint e preservar diagnóstico
        id: lint
        continue-on-error: true
        run: npm run lint
      - name: Registrar resultado do lint
        if: always()
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
        run: |
          if [ "$LINT_OUTCOME" = "success" ]; then
            echo '### Lint aprovado' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '### Lint com falhas — ver diagnóstico da etapa anterior' >> "$GITHUB_STEP_SUMMARY"
            echo 'Este job é informativo durante a correção da dívida existente. Testes e build continuam obrigatórios.' >> "$GITHUB_STEP_SUMMARY"
            echo '::warning::O lint não passou. Consulte os erros; este resultado não bloqueia a validação nesta etapa.'
          fi

  hosting-build:
    name: Preparar artefato do Firebase Hosting
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.FIREBASE_HOSTING_AUTO_DEPLOY == 'true'
    needs: [secrets, validate, permissions, cloud]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: firebase-production
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.bundle.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Compilar com a configuração pública de produção
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_INSTALLATION_ID: ${{ vars.VITE_INSTALLATION_ID }}
          VITE_INSTALLATION_NAME: ${{ vars.VITE_INSTALLATION_NAME }}
          VITE_INSTALLATION_MODE: ${{ vars.VITE_INSTALLATION_MODE }}
          VITE_PUBLIC_RELEASE_STAGE: ${{ vars.VITE_PUBLIC_RELEASE_STAGE }}
          VITE_DATA_CONTROLLER_NAME: ${{ vars.VITE_DATA_CONTROLLER_NAME }}
          VITE_DATA_CONTROLLER_DOCUMENT: ${{ vars.VITE_DATA_CONTROLLER_DOCUMENT }}
          VITE_PRIVACY_CONTACT_EMAIL: ${{ vars.VITE_PRIVACY_CONTACT_EMAIL }}
          VITE_DISABLE_AI: ${{ vars.VITE_DISABLE_AI }}
        run: |
          if [[ -z "$VITE_INSTALLATION_MODE" || -z "$VITE_PUBLIC_RELEASE_STAGE" ]]; then
            echo '::error::Defina explicitamente o modo de instalação e a etapa de publicação do site atual.'
            exit 1
          fi
          npm run build:production
          test -s dist/index.html
          test ! -e dist/local-data
          test -z "$(find dist -type l -print -quit)"
          printf '{"revision":"%s"}\n' "$GITHUB_SHA" > dist/release.json
      - id: bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: firebase-hosting-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 3

  hosting-deploy:
    name: Publicar no Firebase Hosting
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.FIREBASE_HOSTING_AUTO_DEPLOY == 'true'
    needs: [hosting-build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: firebase-production
      url: https://plataforma-educacional-73df6.web.app
    concurrency:
      group: firebase-hosting-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: current
        name: Confirmar que a revisão ainda é a ponta da main
        run: |
          latest="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          if [[ "$latest" != "$GITHUB_SHA" ]]; then
            echo '::notice::A main avançou. Nenhuma publicação foi feita por esta execução.'
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.current.outputs.deploy == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - if: steps.current.outputs.deploy == 'true'
        run: npm ci --ignore-scripts
      - if: steps.current.outputs.deploy == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.hosting-build.outputs.artifact-id }}
          path: dist
      - if: steps.current.outputs.deploy == 'true'
        name: Validar o artefato e a configuração de Hosting
        run: |
          test -s dist/index.html
          node --input-type=module -e 'import fs from "node:fs"; const read = p => JSON.parse(fs.readFileSync(p, "utf8")); if (read("dist/release.json").revision !== process.env.GITHUB_SHA || read(".firebaserc").projects.production !== "plataforma-educacional-73df6") process.exit(1); const hosting = read("firebase.json").hosting; if (hosting.public !== "dist" || hosting.site || hosting.target || hosting.rewrites?.some(r => r.function || r.run)) process.exit(1);'
      - if: steps.current.outputs.deploy == 'true'
        name: Autenticar sem chave permanente
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: plataforma-educacional-73df6
          workload_identity_provider: ${{ vars.FIREBASE_WIF_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      - if: steps.current.outputs.deploy == 'true'
        name: Publicar apenas Hosting e validar a revisão pública
        run: |
          latest="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          if [[ "$latest" != "$GITHUB_SHA" ]]; then
            echo '::notice::A main avançou durante a preparação. Nada foi publicado.'
            exit 0
          fi
          node node_modules/firebase-tools/lib/bin/firebase.js deploy \
            --only hosting --project plataforma-educacional-73df6 \
            --non-interactive --message "GitHub Actions: $GITHUB_SHA"
          url="https://plataforma-educacional-73df6.web.app/release.json?revision=$GITHUB_SHA"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 10 "$url&attempt=$attempt" |
              node --input-type=module -e 'import fs from "node:fs"; try { if (JSON.parse(fs.readFileSync(0, "utf8")).revision !== process.env.GITHUB_SHA) process.exit(1); } catch { process.exit(1); }'; then
              echo "Revisão publicada e verificada: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo '::error::O CLI retornou sucesso, mas a revisão não pôde ser verificada no site público.'
          exit 1

name: Desenvolvimento

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No credentials are required for tests or compilation. Explicit empty values
# also override any accidental local .env files included in the checkout.
env:
  VITE_FIREBASE_API_KEY: ''
  VITE_FIREBASE_AUTH_DOMAIN: ''
  VITE_FIREBASE_PROJECT_ID: ''
  VITE_FIREBASE_STORAGE_BUCKET: ''
  VITE_FIREBASE_MESSAGING_SENDER_ID: ''
  VITE_FIREBASE_APP_ID: ''
  VITE_FIREBASE_MEASUREMENT_ID: ''
  VITE_GEMINI_API_KEY: ''
  VITE_USE_FIREBASE_EMULATORS: 'false'
  VITE_DISABLE_AI: 'true'

jobs:
  secrets:
    name: Verificar segredos introduzidos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Instalar verificador com versão e checksum fixados
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks"
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Conferir arquivos privados e proteções do Git
        run: node scripts/security/check-private-files.mjs
      - name: Impedir novos segredos em commits com saída mascarada
        env:
          SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SCAN_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if ! [[ "$SCAN_HEAD" =~ ^[0-9a-f]{40}$ ]]; then exit 1; fi
          if ! [[ "$SCAN_BASE" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "$SCAN_BASE^{commit}" 2>/dev/null; then
            SCAN_BASE=$(git rev-parse "$SCAN_HEAD^")
          fi
          "$RUNNER_TEMP/gitleaks/gitleaks" git . --log-opts="$SCAN_BASE..$SCAN_HEAD" --redact=100 --ignore-gitleaks-allow --report-format=json --report-path="$RUNNER_TEMP/gitleaks-report.json"

  validate:
    name: Testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências do lockfile
        run: npm ci
      - name: Exigir conteúdo individual nos 582 laboratórios
        run: npm run labs:audit
      - name: Conferir os índices leves do catálogo
        run: node scripts/labs/generate-learning-index.mjs --check
      - name: Testar sem serviços reais
        run: npm run test:local
      - name: Compilar TypeScript e aplicação
        run: npm run build

  permissions:
    name: Permissões e fluxos no Firebase local
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar dependências do lockfile
        run: npm ci
      - name: Verificar Auth e Firestore locais
        run: npm run emulators:check
      - name: Verificar captura e relatórios de aprendizagem
        run: npm run etl:emulator-check
      - name: Verificar publicação, privacidade e acompanhamento
        run: npm run evolution:emulator-check

  cloud:
    name: Contêineres e vínculo por instalação
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validar isolamento e configuração pública
        run: node --test scripts/cloud/installation.test.mjs
      - name: Gerar configurações fictícias fora do Git
        run: node scripts/cloud/fixtures.mjs
      - name: Compilar imagem da escola com configuração fictícia
        run: >-
          docker build --secret id=installation,src=.local/cloud-fixtures/school.json
          --build-arg KORTEX_INSTALLATION_SHA256=$(node scripts/cloud/manifest-fingerprint.mjs .local/cloud-fixtures/school.json)
          --build-arg KORTEX_SOURCE_REVISION=${{ github.sha }} -t kortex-school:ci .
      - name: Verificar contêiner da escola e recusa de instalação incorreta
        run: node scripts/cloud/check-container.mjs .local/cloud-fixtures/school.json --image kortex-school:ci
      - name: Compilar imagem doméstica com configuração fictícia
        run: >-
          docker build --secret id=installation,src=.local/cloud-fixtures/home.json
          --build-arg KORTEX_INSTALLATION_SHA256=$(node scripts/cloud/manifest-fingerprint.mjs .local/cloud-fixtures/home.json)
          --build-arg KORTEX_SOURCE_REVISION=${{ github.sha }} -t kortex-home:ci .
      - name: Verificar contêiner doméstico e recusa de instalação incorreta
        run: node scripts/cloud/check-container.mjs .local/cloud-fixtures/home.json --image kortex-home:ci

  lint:
    name: Lint informativo — dívida existente
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências do lockfile
        run: npm ci
      - name: Executar lint e preservar diagnóstico
        id: lint
        continue-on-error: true
        run: npm run lint
      - name: Registrar resultado do lint
        if: always()
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
        run: |
          if [ "$LINT_OUTCOME" = "success" ]; then
            echo '### Lint aprovado' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '### Lint com falhas — ver diagnóstico da etapa anterior' >> "$GITHUB_STEP_SUMMARY"
            echo 'Este job é informativo durante a correção da dívida existente. Testes e build continuam obrigatórios.' >> "$GITHUB_STEP_SUMMARY"
            echo '::warning::O lint não passou. Consulte os erros; este resultado não bloqueia a validação nesta etapa.'
          fi
